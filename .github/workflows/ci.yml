name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        python: ["3.12"]
        node: ["22"]
        include:
          - { os: ubuntu-latest, python: "3.11", node: "20" }
          - { os: ubuntu-latest, python: "3.13", node: "24" }
    defaults:
      run:
        working-directory: webchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Widget
        working-directory: webchat/widget
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Types
        run: mypy
      - name: Tests
        run: python -m pytest

  browsers:
    name: Browser tests in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # WebKit is Safari's engine, so this covers iPhones and iPads, where every browser uses it.
        browser: [webkit, firefox]
    defaults:
      run:
        working-directory: webchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Widget
        working-directory: webchat/widget
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: python -m pytest tests/e2e

  no-docker:
    name: run.py on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python run.py --check

  docker:
    name: Docker on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 90 dealership-platform
      - run: docker compose up --build -d
      - name: All three services answer
        run: |
          sleep 8
          docker compose ps
          curl --fail --silent --show-error http://localhost:4010/health
          curl --fail --silent --show-error http://localhost:4173/ > /dev/null
          curl --fail --silent --show-error http://localhost:4020/health
          curl --fail --silent --show-error http://localhost:4020/widget.js > /dev/null
      - name: With no Ollama installed, the bundled model answers
        run: |
          docker compose logs webchat | grep '"event": "startup"' | grep '"llm_choice": "fallback"'
          jar=$(mktemp)
          curl --fail -s -c $jar -b $jar -X POST -H "Origin: http://localhost:4173" \
            http://localhost:4020/api/session > /dev/null
          reply=$(curl --fail -s -c $jar -b $jar -X POST -H "Origin: http://localhost:4173" \
            -H "Content-Type: application/json" -d '{"text":"what time does bolton open on sunday"}' \
            http://localhost:4020/api/chat/message)
          echo "$reply"
          docker compose logs webchat | grep '"event": "turn"' | grep '"interpretation": "model"'
